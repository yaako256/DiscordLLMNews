# compose.yaml
services:
  # 開発用コンテナ
  # Rustの開発ができる
  discord_llm_news_dev:
    container_name: discord_llm_news_dev
    build:
      context: .
      dockerfile: .docker/dev/Dockerfile
    volumes:
      - .:/app
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
      # 開発用configをvolume化(configを変更後のコンテナrebuildが必要なくなる)
      - ./.config/dev:/app/.config
      # dataもvolume化
      - ./data/dev:/app/data
    # 作業用ディレクトリの指定
    working_dir: /app
    # 仮想端末を割り当てる？
    tty: true
    command: bash -c "cargo watch -x check"

    # ログローテーションの設定（ディスク満杯防止）
    # Dockerのログだけが対象(自前jsonlなどは対象外)
    logging:
      driver: "json-file"
      options:
        max-size: "10m" # 1つのログファイルは最大10MB
        max-file: "3" # 過去ログは最大3ファイルまで保持（計30MB）

  # 本番用コンテナ
  # Rustバイナリだけ入れる。
  # このコンテナを常駐させ、cronに定期実行させる。
  discord_llm_news:
    container_name: discord_llm_news
    build:
      context: .
      dockerfile: .docker/prod/Dockerfile
    restart: unless-stopped
    volumes:
      # 本番用configをvolume化(configを変更後のコンテナrebuildが必要なくなる)
      - ./.config/prod:/app/.config
      # dataもvolume化
      - ./data/prod:/app/data
    # 以下本番用制限設定関連
    # リソース制限の設定（Compose V3仕様）
    deploy:
      resources:
        limits:
          # Rust+HTTPくらいならこれでいい
          cpus: '0.5' # CPUの最大コア数を制限
          memory: 128M # メモリの最大値を制限
    # ログローテーションの設定（ディスク満杯防止）
    # Dockerのログだけが対象(自前jsonlなどは対象外)
    logging:
      driver: "json-file"
      options:
        max-size: "10m" # 1つのログファイルは最大10MB
        max-file: "3" # 過去ログは最大3ファイルまで保持（計30MB）

volumes:
  cargo_cache:
  target_cache:
