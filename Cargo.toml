# Cargo.toml
[workspace]
resolver = "3"
members = ["crates/*"]

# 子クレートでも使用できるようなるライブラリ
[workspace.dependencies]
# エラー型の定義用
thiserror = "2.0.17"
# ログ・構造化ロギング
tracing = "0.1"
# ログの出力・成形用
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Json用
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 非同期処理
tokio = { version = "1", features = ["full"] }
# 非同期トレイト用
async-trait = "0.1"

# 時間型用
chrono = { version = "0.4", features = ["serde"] }

# HTTPリクエスト用
reqwest = { version = "0.12", features = ["json"]}







# リリースビルド用の処理設定
[profile.release]
# 最大限の最適化
opt-level = 3
# リンク時最適化（バイナリサイズ削減と高速化）
lto = true
# コンパイル時間は増えるが、実行速度が向上する
codegen-units = 1
# シンボル情報を削除してバイナリを軽量化
strip = true