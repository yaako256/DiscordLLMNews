# .config/prod/app.toml
# 本番用のconfigファイル
# ここに定数設定などを書いていく
# 開発用に比べRSSや本文の取得間隔など、待機時間などを伸ばしている

# =========================
# RSS関連の設定
# =========================
[rss]
# RSSを取得する個数
feed_fetch_limit = 10

# サーバ負荷対策等
# RSS取得のクールタイム
rss_fetch_interval_ms = 60000
# 本文取得のクールタイム
body_fetch_interval_ms = 60000
# HTTPのタイムアウト秒数
timeout_s = 45

# =========================
# LLM関連の設定
# =========================
[llm]
# 注意！APIキーは.envでの上書きで指定する！
gemini_api_key = "api-key"

# モデルの定義(fallback)
fallback_models = [
  "gemini-3.1-flash-lite-preview",
  "gemini-3-flash-preview",
  "gemini-2.5-flash",
  "gemini-2.5-flash-lite",
  "gemini-2.5-pro"
  ]

# タイトルから選出する個数
title_select_limit = 3

# 本文から選出する個数
body_select_limit = 1

# HTTPのタイムアウト秒数
timeout_s = 240

# 最大リトライ数(1リクエスト)
max_retry = 5

# LLMのクールタイム関連を定義
[llm.sleep]
# LLMリクエストの標準クールタイム[ms]
request_interval_ms = 61000

# 指数バックオフ関連
# 現在の待ち時間計算
# -------------------------------------------
# 1回目ミス： 65秒 + (15秒 × 1.5^1) ＝ 87.5秒
# 2回目ミス： 65秒 + (15秒 × 1.5^2) ＝ 98.7秒
# 3回目ミス： 65秒 + (15秒 × 1.5^3) ＝ 115.6秒
# 4回目ミス： 65秒 + (15秒 × 1.5^4) ＝ 140.9秒
# -------------------------------------------
# 初期値[ms]
backoff_initial_delay = 65000
# 累乗対象[ms]
backoff_base = 15000
# 累乗の量
backoff_exponent_factor = 1.5
# 最大待機時間[ms]
backoff_max_time = 600000


# =========================
# プロンプトファイルのパス設定
# =========================
[prompt_paths]
# タイトルから選出するときのプロンプト
select_title = ".config/prompts/select_title.md"
# 本文から選出するときのプロンプト
select_body = ".config/prompts/select_title.md"
# 本文要約・整形するときのプロンプト
summarize = ".config/prompts/summarize.md"


# =========================
# システム関連の設定
# =========================
# このシステム全体関連の定義
[system]
# feed結果取得失敗時、何秒おきにfeed結果を確認するか
poll_interval_secs = 30
# 何分でfeedがhangした判定とみなすか
hang_threshold_minutes = 50

# =========================
# パッチ通知関連
# =========================
[patch]
# バージョン番号
version = "3.0.1"
# パッチノートが書かれたパス
patch_note_path = ".config/patch_note.md"


# =========================
# Discord関連の設定
# =========================
[discord]
# 注意！webhookは.envでの上書きで指定する！
# 通知用webhook
news_webhooks = ["Webhook1","Webhook2"]
# ログ通知用webhook
logs_webhooks = ["Webhook1","Webhook2"]
