# .config/dev/app.toml
# 開発用のconfigファイル
# ここに定数設定などを書いていく


# =========================
# RSS関連の設定
# =========================
[rss]
# RSSを取得する個数
feed_fetch_limit = 4

# サーバ負荷対策等
# RSS取得のクールタイム
rss_fetch_interval_ms = 10000
# 本文取得のクールタイム
body_fetch_interval_ms = 31000
# HTTPのタイムアウト秒数
timeout_s = 180

# =========================
# LLM関連の設定
# =========================
[llm]
# 注意！APIキーは.envでの上書きで指定する！
gemini_api_key = "api-key"

# モデルの定義(fallback)
fallback_models = [
  "gemini-3.1-flash-lite-preview",
  "gemini-3-flash-preview",
  "gemini-2.5-flash",
  "gemini-2.5-flash-lite",
  "gemini-2.5-pro"
  ]

# タイトルから選出する個数
title_select_limit = 2

# 本文から選出する個数
body_select_limit = 1

# HTTPのタイムアウト秒数
timeout_s = 180

# 最大リトライ数(1リクエスト)
max_retry = 5

# LLMのクールタイム関連を定義
[llm.sleep]
# LLMリクエストの標準クールタイム[ms]
request_interval_ms = 31000

# 指数バックオフ関連
# 初期値[ms]
backoff_initial_delay = 20000
# 累乗対象[ms]
backoff_base = 10000
# 累乗の量
backoff_exponent_factor = 1.3
# 最大待機時間[ms]
backoff_max_time = 1200000


# =========================
# プロンプトファイルのパス設定
# =========================
[prompt_paths]
# タイトルから選出するときのプロンプト
select_title = ".config/prompts/select_title.md"
# 本文から選出するときのプロンプト
select_body = ".config/prompts/select_title.md"
# 本文要約・整形するときのプロンプト
summarize = ".config/prompts/summarize.md"


# =========================
# Discord関連の設定
# =========================
[discord]
# 注意！webhookは.envでの上書きで指定する！
# 通知用webhook
news_webhooks = ["Webhook1","Webhook2"]
# ログ通知用webhook
logs_webhooks = ["Webhook1","Webhook2"]